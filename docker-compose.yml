# Full local stack: gateway -> api -> mongo, api -> kafka -> worker -> mongo.
# Local-JWT auth by default; add docker-compose.keycloak.yml to put Keycloak in front (see README).
name: opsbridge

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
  SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}

services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    restart: unless-stopped
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      <<: *common-env
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/opsbridge
      KAFKA_BROKERS: kafka:9092
      AUTH_MODE: ${API_AUTH_MODE:-local}
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-secret-change-me-0123456789}
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-only-internal-key-0123456789}
      ENABLE_CHAOS: ${ENABLE_CHAOS:-true}
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  worker:
    restart: unless-stopped
    build: { context: ., dockerfile: services/worker/Dockerfile }
    environment:
      <<: *common-env
      MONGO_URL: mongodb://mongo:27017/opsbridge
      KAFKA_BROKERS: kafka:9092
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    restart: unless-stopped
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      <<: *common-env
      PORT: 8080
      UPSTREAM_URL: http://api:3000
      AUTH_MODE: ${GATEWAY_AUTH_MODE:-local}
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-secret-change-me-0123456789}
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-only-internal-key-0123456789}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-3000}
    depends_on: [api]

volumes:
  mongo-data:
